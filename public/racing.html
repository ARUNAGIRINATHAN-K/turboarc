  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f172a;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #f8fafc;
    user-select: none;
  }
  .race-shell {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .canvas-mount {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .race-ui-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  [hidden] { display: none !important; }

  /* Title Screen */
  .title-screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 48px;
    background: linear-gradient(180deg, rgba(10,14,22,0.12) 0%, rgba(10,14,22,0.72) 100%);
    pointer-events: auto;
  }
  .title-panel {
    max-width: 520px;
  }
  .title-emblem {
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
    margin-bottom: 24px;
    filter: drop-shadow(0 6px 20px rgba(0,0,0,0.6));
  }
  .title-actions {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .control-strip {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
    letter-spacing: 0.02em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.85);
  }

  /* Buttons */
  .btn-primary, .btn-secondary {
    pointer-events: auto;
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
    transition: transform 0.14s ease, background-color 0.14s ease;
  }
  .btn-primary {
    background: #ef4444;
    color: #ffffff;
    box-shadow: 0 6px 20px rgba(239,68,68,0.35);
  }
  .btn-primary:hover { background: #dc2626; transform: translateY(-1px); }
  .btn-secondary {
    background: rgba(30, 41, 59, 0.92);
    color: #f8fafc;
    border: 1px solid rgba(255,255,255,0.16);
  }
  .btn-secondary:hover { background: rgba(51, 65, 85, 0.96); }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, .icon-btn:focus-visible {
    outline: 2px solid #f8fafc;
    outline-offset: 2px;
  }

  /* Playing HUD */
  .hud-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .hud-card {
    position: absolute;
    background: rgba(12, 16, 24, 0.84);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.36);
  }
  .hud-tl {
    top: 20px;
    left: 20px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .pos-block {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .pos-num {
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    color: #f8fafc;
    font-variant-numeric: tabular-nums;
  }
  .pos-meta {
    display: flex;
    flex-direction: column;
    font-size: 11px;
    font-weight: 700;
    color: #94a3b8;
    line-height: 1.15;
  }
  .pos-ord { color: #ef4444; }
  .hud-divider {
    width: 1px;
    height: 36px;
    background: rgba(255,255,255,0.12);
  }
  .lap-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .hud-kicker {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #94a3b8;
    text-transform: uppercase;
  }
  .hud-val {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .times-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 132px;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .time-val {
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #f8fafc;
  }
  .time-val.accent { color: #f59e0b; }

  /* Top-Right Icon Buttons */
  .hud-tr {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .demo-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #f59e0b;
    background: rgba(12, 16, 24, 0.84);
    border: 1px solid rgba(245, 158, 11, 0.35);
    border-radius: 6px;
    padding: 8px 12px;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    background: rgba(12, 16, 24, 0.84);
    border: 1px solid rgba(255,255,255,0.14);
    color: #f8fafc;
    cursor: pointer;
    transition: background-color 0.14s ease;
  }
  .icon-btn:hover { background: rgba(30, 41, 59, 0.94); }
  .icon-btn[data-muted="1"] { color: #ef4444; }
  .icon-btn[data-mode="cockpit"] { border-color: #06b6d4; color: #38bdf8; }

  /* Countdown Banner */
  .countdown-banner {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 92px;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #ef4444;
    text-shadow: 0 6px 24px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
  }
  .countdown-banner[data-go="1"] {
    color: #22c55e;
  }

  /* Minimap */
  .hud-bl {
    bottom: 20px;
    left: 20px;
    padding: 8px;
  }
  .hud-bl canvas {
    display: block;
    width: 176px;
    height: 132px;
  }

  /* Speedometer */
  .hud-br {
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    min-width: 140px;
    text-align: right;
  }
  .drift-indicator {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #f59e0b;
    margin-bottom: 2px;
    transition: opacity 0.1s ease;
  }
  .speed-num {
    font-size: 46px;
    font-weight: 900;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    color: #f8fafc;
  }
  .speed-unit {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #94a3b8;
    margin-top: 2px;
  }

  /* Modals */
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 18, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    pointer-events: auto;
  }
  .modal-card {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 28px 32px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 48px rgba(0,0,0,0.6);
  }
  .results-card {
    max-width: 640px;
  }
  .modal-card h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
  }
  .modal-sub {
    margin: 0 0 20px;
    font-size: 13px;
    color: #94a3b8;
  }
  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 22px;
  }

  /* Results Table */
  .results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .results-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #94a3b8;
    padding: 8px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .results-table td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    vertical-align: middle;
  }
  .results-table tr.is-player td {
    background: rgba(239, 68, 68, 0.12);
    font-weight: 700;
  }
  .results-table .num {
    text-align: right;
    font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .results-table td.muted { color: #94a3b8; }
  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 8px;
    vertical-align: -1px;
  }

  @media (max-width: 640px) {
    .title-screen { padding: 24px; }
    .hud-tl { top: 12px; left: 12px; padding: 10px 12px; gap: 10px; }
    .pos-num { font-size: 28px; }
    .hud-val { font-size: 18px; }
    .times-block { min-width: 105px; }
    .hud-tr { top: 12px; right: 12px; }
    .hud-bl { bottom: 12px; left: 12px; }
    .hud-bl canvas { width: 132px; height: 99px; }
    .hud-br { bottom: 12px; right: 12px; padding: 10px 14px; min-width: 108px; }
    .speed-num { font-size: 34px; }
  }
